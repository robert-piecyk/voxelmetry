[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voxelmetry"
version = "2.0.0"
description = "Morphometry for CT and MR segmentations, with a 3-D viewer that fits in one HTML file."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Robert Piecyk" }]
keywords = ["medical-imaging", "ct", "segmentation", "visualization", "nrrd", "dicom"]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-image>=0.22",
    "SimpleITK>=2.3",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
dicom = ["pydicom>=2.4"]
# trimesh dispatches quadric decimation to fast-simplification; without it,
# decimate() silently falls back to vertex clustering. Declared so an install
# exercises the same path the docs describe.
mesh = ["trimesh>=4.0", "fast-simplification>=0.1.7"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]
all = ["voxelmetry[dicom,mesh,dev]"]

[project.urls]
Homepage = "https://github.com/robert-piecyk/voxelmetry"
Documentation = "https://robert-piecyk.github.io/voxelmetry/"
Source = "https://github.com/robert-piecyk/voxelmetry"

[project.scripts]
voxelmetry = "voxelmetry.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# typer's entire API is function calls in argument defaults; B008 is wrong here.
"src/voxelmetry/cli.py" = ["B008"]
# The viewer template is a JS/CSS blob whose line lengths are not Python's business.
"src/voxelmetry/viewer/html.py" = ["E501"]
