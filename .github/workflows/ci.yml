name: CI

on:
  push:
    branches: [main, v2-rebuild]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[all]"

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install viewer test harness
        working-directory: tests/js
        run: npm install --no-audit --no-fund

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest --cov=voxelmetry --cov-report=term-missing --cov-fail-under=90

      - name: Smoke-test the CLI end to end
        run: |
          voxelmetry demo -o /tmp/demo.html
          test -s /tmp/demo.html
