name: Pages

# Publishes docs/ to the gh-pages branch, which GitHub's built-in
# pages-build-deployment then serves. This deliberately does not use
# actions/configure-pages: that path needs the repository's Pages source set to
# "GitHub Actions", and a branch-based source works without any repository
# setting being changed.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Check every referenced asset exists
        run: |
          test -f docs/index.html
          missing=0
          for asset in $(grep -oE 'src="[^"#:]+\.(png|jpg|svg)"' docs/index.html \
                         | sed 's/src="//; s/"//'); do
            if [ ! -f "docs/$asset" ]; then
              echo "missing asset: docs/$asset"
              missing=1
            fi
          done
          exit $missing

      - name: Publish docs/ to gh-pages
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage the site outside the work tree before rewriting the branch.
          cp -r docs "$RUNNER_TEMP/site"
          touch "$RUNNER_TEMP/site/.nojekyll"   # serve files as-is, no Jekyll

          # A fresh orphan each time: the branch is generated output, so it
          # carries no history worth keeping and never accumulates old assets.
          git checkout --orphan gh-pages-build
          git rm -rf --cached . > /dev/null
          find . -maxdepth 1 -mindepth 1 -not -name .git -exec rm -rf {} +
          cp -r "$RUNNER_TEMP/site/." .

          git add -A
          git commit -q -m "Publish docs/ from ${GITHUB_SHA::7}"
          git push -f origin gh-pages-build:gh-pages
          echo "published $(ls | tr '\n' ' ')"
